plugins {
    id 'java'
    id "com.github.node-gradle.node" version "7.1.0"
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'run.halo.editor.hyperlink'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.22.11')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

def pnpmVersionFromPackageJson = providers.provider {
    def packageManager = packageJson.get("packageManager")
    def matcher = (packageManager ?: "") =~ /^pnpm@([^+]+)(?:\+.*)?$/
    if (!matcher.matches()) {
        throw new GradleException("Expected package.json packageManager to be pnpm@<version>, but got: ${packageManager}")
    }
    matcher[0][1]
}

node {
    nodeProjectDir = file("${project.projectDir}")
    pnpmVersion.set(pnpmVersionFromPackageJson)
}

tasks.register('buildFrontend', PnpmTask) {
    args = ['build']
    dependsOn('installDepsForUI')
}

tasks.register('installDepsForUI', PnpmTask) {
    args = ['install']
}

build {
    // build frontend before build
    tasks.named('compileJava').configure {
        dependsOn('buildFrontend')
    }
}

halo {
    version = '2.22'
    debug = true
}
